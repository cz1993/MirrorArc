schema_version: 1
id: research-learning
name: Research and Learning
profile_version: 0.2.0
description: Governed knowledge-projection profile for research and learning evidence.

markdown_categories:
  index: {persistence: manual}
  authoritative_markdown_source: {persistence: authoritative}
  l1_projection: {persistence: rebuildable}
  l2_generated_view: {persistence: ephemeral}
  l2_reviewed_view: {persistence: governed}
  operational_control: {persistence: required}
relationship_types:
  MIRRORS: {deterministic: true, review_required: false}
  DERIVED_FROM: {deterministic: true, review_required: false}
  IN_DOMAIN: {deterministic: true, review_required: false}
  HAS_LIFECYCLE: {deterministic: true, review_required: false}
  IN_PROFILE: {deterministic: true, review_required: false}
  DEPENDS_ON: {deterministic: true, review_required: false}
  REVIEW_DEPENDS_ON: {deterministic: true, review_required: false}
  IN_CONTEXT: {deterministic: true, review_required: false}
  MENTIONS: {deterministic: false, review_required: true}
  SAME_ENTITY: {deterministic: false, review_required: true}
  SUPPORTS: {deterministic: false, review_required: true}
  CONTRADICTS: {deterministic: false, review_required: true}
  SUPERSEDES: {deterministic: false, review_required: true}
  GOVERNS: {deterministic: false, review_required: true}
  INVALIDATES: {deterministic: true, review_required: false}
knowledge_lenses:
  evidence-synthesis:
    purpose: Compare source-backed positions for a research question.
    audience: researcher
    source_query: {}
    relationship_types: [SUPPORTS, CONTRADICTS, SUPERSEDES]
    output_sections: [question, evidence-for, evidence-against, gaps]
    max_tokens: 2200
    persistence: ephemeral
    citation_required: true
review_policy: {semantic_proposals_require_review: true, preserve_reviewed_views: true, automatic_promotion: false}
context_defaults: {max_tokens: 5000, max_files: 25, max_excerpt_chars: 7000, allowed_modes: [metadata, dynamic, frozen]}

domains:
  inbox:
    folder: 00_inbox
    purpose: Intake lane for unprocessed research material and agent drafts.
  sources:
    folder: 10_sources
    purpose: Source inventories, literature records, repository mirrors, and raw-source references.
  literature:
    folder: 20_literature
    purpose: Papers, books, articles, talks, datasets, and bibliographic notes.
  concepts:
    folder: 30_concepts
    purpose: Concepts, definitions, theories, methods, and reusable explanations.
  questions:
    folder: 40_questions
    purpose: Open questions, hypotheses, experiments, and inquiry backlogs.
  projects:
    folder: 50_projects
    purpose: Research projects, courses, reading programs, and study plans.
  syntheses:
    folder: 60_syntheses
    purpose: Human-curated findings, literature reviews, essays, and decision-ready summaries.
  reading:
    folder: 70_reading
    purpose: Reading queue, watch lists, review cadence, and learning workflows.
  archive:
    folder: 80_archive
    purpose: Retired research material kept for provenance and later retrieval.

note_types:
  moc:
    purpose: Legacy curated derivative retained only for migration classification.
    legacy_derivative: true
    markdown_category: legacy_curated_derivative
  note:
    purpose: Legacy curated derivative retained only for migration classification.
    legacy_derivative: true
    markdown_category: legacy_curated_derivative
  authoritative-record:
    purpose: Deliberately authored Markdown source.
    markdown_category: authoritative_markdown_source
  knowledge-view:
    purpose: Governed L2 knowledge-view output.
    machine_owned: true
    markdown_category: l2_generated_view
  operational-control:
    purpose: Runtime, governance, profile, or operator control.
    markdown_category: operational_control
  source:
    purpose: Human-readable source summary or bibliographic companion.
  literature-note:
    purpose: Note about a paper, book, article, talk, or dataset.
  concept:
    purpose: Stable explanation of a concept, method, or term.
  question:
    purpose: Open question, hypothesis, or investigation prompt.
  experiment:
    purpose: Research experiment, reading exercise, or evaluation protocol.
  synthesis:
    purpose: Curated synthesis across sources or research threads.
  course:
    purpose: Course, syllabus, or structured learning program.
  project:
    purpose: Research or learning project page.
  source-mirror:
    purpose: Machine-generated mirror of a binary/source file.
    machine_owned: true
    markdown_category: l1_projection
  source-ref:
    purpose: Human-readable companion for a non-mirrored source.
    markdown_category: authoritative_markdown_source
  repo-mirror:
    purpose: Machine-generated mirror of a configured repository.
    machine_owned: true
    markdown_category: l1_projection

statuses:
  draft:
    purpose: Draft material not yet reviewed.
    attention: true
  active:
    purpose: Current reviewed working knowledge.
  in-review:
    purpose: Awaiting human review.
    attention: true
  validated:
    purpose: Reviewed and accepted for durable use.
  superseded:
    purpose: Replaced by newer research material.
    inactive: true
  archived:
    purpose: Retained but no longer active.
    inactive: true

required_properties:
  - title
  - type
  - status
  - domain
  - created
  - updated

optional_properties:
  - owner
  - tags
  - related
  - markdown_category
  - authority
  - research_project
  - literature_collection
  - course
  - source_url

folder_plan:
  - path: 00_inbox
    domain: inbox
  - path: 10_sources
    domain: sources
  - path: 10_sources/repos
    domain: sources
  - path: 20_literature
    domain: literature
  - path: 30_concepts
    domain: concepts
  - path: 40_questions
    domain: questions
  - path: 50_projects
    domain: projects
  - path: 60_syntheses
    domain: syntheses
  - path: 70_reading
    domain: reading
  - path: 80_archive
    domain: archive

templates:
  - _templates/base-note.md
  - _templates/source-ref.md

views: []
skills: []
benchmark_tasks: []

policy_defaults:
  mirror_mode: dedicated
  mirror_root: _mirrors
  native_source_mode: direct
  mirror_status: active
  repo_stub_status: draft
  repo_notes_dir: 10_sources/repos
  original_sources_authoritative: true
  real_data_in_repo: false
