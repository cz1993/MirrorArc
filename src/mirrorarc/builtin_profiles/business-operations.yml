schema_version: 1
id: business-operations
name: Business Operations
profile_version: 0.2.0
description: Compatibility knowledge-projection profile for business-operations vaults.

markdown_categories:
  index: {persistence: manual}
  authoritative_markdown_source: {persistence: authoritative}
  l1_projection: {persistence: rebuildable}
  l2_generated_view: {persistence: ephemeral}
  l2_reviewed_view: {persistence: governed}
  operational_control: {persistence: required}
relationship_types:
  MIRRORS: {deterministic: true, review_required: false}
  DERIVED_FROM: {deterministic: true, review_required: false}
  IN_DOMAIN: {deterministic: true, review_required: false}
  HAS_LIFECYCLE: {deterministic: true, review_required: false}
  IN_PROFILE: {deterministic: true, review_required: false}
  DEPENDS_ON: {deterministic: true, review_required: false}
  REVIEW_DEPENDS_ON: {deterministic: true, review_required: false}
  IN_CONTEXT: {deterministic: true, review_required: false}
  MENTIONS: {deterministic: false, review_required: true}
  SAME_ENTITY: {deterministic: false, review_required: true}
  SUPPORTS: {deterministic: false, review_required: true}
  CONTRADICTS: {deterministic: false, review_required: true}
  SUPERSEDES: {deterministic: false, review_required: true}
  GOVERNS: {deterministic: false, review_required: true}
  INVALIDATES: {deterministic: true, review_required: false}
knowledge_lenses:
  orientation:
    purpose: Orient an operator to current governed business evidence.
    audience: workspace reviewer
    source_query: {}
    relationship_types: [MIRRORS, IN_DOMAIN, GOVERNS]
    output_sections: [scope, evidence, controls, review-work]
    max_tokens: 1600
    persistence: ephemeral
    citation_required: true
review_policy: {semantic_proposals_require_review: true, preserve_reviewed_views: true, automatic_promotion: false}
context_defaults: {max_tokens: 4000, max_files: 20, max_excerpt_chars: 6000, allowed_modes: [metadata, dynamic, frozen]}

domains:
  intake:
    folder: 00_inbox
    purpose: Triage lane for unprocessed source files and agent drafts.
  governance:
    folder: 10_governance
    purpose: Company identity, ownership, policy, risk, legal, compliance, and board records.
  market:
    folder: 20_market
    purpose: Market understanding, brand, campaigns, communications, and partner-facing material.
  customers:
    folder: 30_customers
    purpose: Accounts, clients, sales opportunities, customer research, support, and relationship history.
  delivery:
    folder: 40_delivery
    purpose: Products, services, projects, implementations, engagements, and delivery playbooks.
  operations:
    folder: 50_operations
    purpose: Internal operating system, vendors, procurement, IT, security, facilities, and process records.
  finance:
    folder: 60_finance
    purpose: Accounting, tax, payroll, budgets, funding, banking, and financial reporting.
  people:
    folder: 70_people
    purpose: Hiring, employees, contractors, roles, onboarding, learning, and people operations.
  sources:
    folder: 80_sources
    purpose: Source mirrors, public-data fixtures, repository mirrors, and raw-source indexes.

note_types:
  moc:
    purpose: Legacy curated derivative retained only for migration classification.
    legacy_derivative: true
    markdown_category: legacy_curated_derivative
  entity:
    purpose: Legacy curated derivative retained only for migration classification.
    legacy_derivative: true
    markdown_category: legacy_curated_derivative
  note:
    purpose: Legacy curated derivative retained only for migration classification.
    legacy_derivative: true
    markdown_category: legacy_curated_derivative
  authoritative-record:
    purpose: Deliberately authored Markdown source.
    markdown_category: authoritative_markdown_source
  knowledge-view:
    purpose: Governed L2 knowledge-view output.
    machine_owned: true
    markdown_category: l2_generated_view
  operational-control:
    purpose: Runtime, governance, profile, or operator control.
    markdown_category: operational_control
  guide:
    purpose: How-to or runbook.
  policy:
    purpose: Governing policy or procedure.
  record:
    purpose: Dated report, meeting note, decision, or evidence record.
  source-mirror:
    purpose: Machine-generated mirror of a binary/source file.
    machine_owned: true
    markdown_category: l1_projection
  source-ref:
    purpose: Human-readable companion for a non-mirrored source.
    markdown_category: authoritative_markdown_source
  repo-mirror:
    purpose: Machine-generated mirror of a configured repository.
    machine_owned: true
    markdown_category: l1_projection

statuses:
  draft:
    purpose: Agent- or human-drafted material not yet promoted.
    attention: true
  active:
    purpose: Current reviewed working knowledge.
  in-review:
    purpose: Awaiting human review.
    attention: true
  sent:
    purpose: Sent externally.
  signed:
    purpose: Signed or formally accepted.
  submitted:
    purpose: Submitted for approval or processing.
  awarded:
    purpose: Awarded or approved.
  superseded:
    purpose: Replaced by newer material.
    inactive: true
  archived:
    purpose: Retained but no longer active.
    inactive: true

required_properties: [title, type, status, domain, created, updated]
optional_properties: [owner, tags, related, markdown_category, authority, account, client, program, vendor]

folder_plan:
  - path: 00_inbox
    domain: intake
  - path: 10_governance
    domain: governance
  - path: 20_market
    domain: market
  - path: 30_customers
    domain: customers
  - path: 40_delivery
    domain: delivery
  - path: 50_operations
    domain: operations
  - path: 60_finance
    domain: finance
  - path: 70_people
    domain: people
  - path: 80_sources
    domain: sources
  - path: 80_sources/repos
    domain: sources

templates:
  - _templates/base-note.md
  - _templates/decision-record.md
  - _templates/source-ref.md

views: [Documents.base]
skills: []
benchmark_tasks: []

policy_defaults:
  mirror_mode: dedicated
  mirror_root: _mirrors
  native_source_mode: direct
  mirror_status: active
  repo_stub_status: draft
  repo_notes_dir: 80_sources/repos
  context_aliases:
    client: account
  original_sources_authoritative: true
  real_data_in_repo: false
