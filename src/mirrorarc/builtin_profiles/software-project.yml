schema_version: 1
id: software-project
name: Software Project
profile_version: 0.2.0
description: Governed software-project evidence with optional revision-bound repository analysis.

markdown_categories:
  index: {persistence: manual}
  authoritative_markdown_source: {persistence: authoritative}
  l1_projection: {persistence: rebuildable}
  l2_generated_view: {persistence: ephemeral}
  l2_reviewed_view: {persistence: governed}
  operational_control: {persistence: required}
relationship_types:
  MIRRORS: {deterministic: true, review_required: false}
  DERIVED_FROM: {deterministic: true, review_required: false}
  IN_DOMAIN: {deterministic: true, review_required: false}
  HAS_LIFECYCLE: {deterministic: true, review_required: false}
  IN_PROFILE: {deterministic: true, review_required: false}
  DEPENDS_ON: {deterministic: true, review_required: false}
  REVIEW_DEPENDS_ON: {deterministic: true, review_required: false}
  IN_CONTEXT: {deterministic: true, review_required: false}
  MENTIONS: {deterministic: false, review_required: true}
  SAME_ENTITY: {deterministic: false, review_required: true}
  SUPPORTS: {deterministic: false, review_required: true}
  CONTRADICTS: {deterministic: false, review_required: true}
  SUPERSEDES: {deterministic: false, review_required: true}
  GOVERNS: {deterministic: false, review_required: true}
  INVALIDATES: {deterministic: true, review_required: false}
knowledge_lenses:
  change-impact:
    purpose: Explain changed project evidence and affected decisions or runbooks.
    audience: maintainer
    source_query: {freshness: changed}
    relationship_types: [DEPENDS_ON, GOVERNS, INVALIDATES]
    output_sections: [changes, impact, stale-views, actions]
    max_tokens: 1800
    persistence: ephemeral
    citation_required: true
review_policy: {semantic_proposals_require_review: true, preserve_reviewed_views: true, automatic_promotion: false}
context_defaults: {max_tokens: 4500, max_files: 25, max_excerpt_chars: 6500, allowed_modes: [metadata, dynamic, frozen]}

domains:
  inbox:
    folder: 00_inbox
    purpose: Intake lane for unprocessed engineering material and agent drafts.
  product:
    folder: 10_product
    purpose: Product requirements, user journeys, roadmap, and planning context.
  architecture:
    folder: 20_architecture
    purpose: Architecture notes, system boundaries, technical strategy, and diagrams.
  decisions:
    folder: 30_decisions
    purpose: ADRs, technical decisions, tradeoffs, and approval records.
  interfaces:
    folder: 40_interfaces
    purpose: APIs, schemas, integrations, contracts, and public interfaces.
  runbooks:
    folder: 50_runbooks
    purpose: Operations runbooks, deployment notes, support playbooks, and maintenance tasks.
  releases:
    folder: 60_releases
    purpose: Release plans, changelogs, quality gates, and rollout notes.
  incidents:
    folder: 70_incidents
    purpose: Incidents, postmortems, risks, and reliability investigations.
  sources:
    folder: 80_sources
    purpose: Repository mirrors, source inventories, external docs, and source references.

note_types:
  moc:
    purpose: Legacy curated derivative retained only for migration classification.
    legacy_derivative: true
    markdown_category: legacy_curated_derivative
  note:
    purpose: Legacy curated derivative retained only for migration classification.
    legacy_derivative: true
    markdown_category: legacy_curated_derivative
  authoritative-record:
    purpose: Deliberately authored Markdown source.
    markdown_category: authoritative_markdown_source
  knowledge-view:
    purpose: Governed L2 knowledge-view output.
    machine_owned: true
    markdown_category: l2_generated_view
  operational-control:
    purpose: Runtime, governance, profile, or operator control.
    markdown_category: operational_control
  guide:
    purpose: How-to, setup, or support guide.
  record:
    purpose: Dated report, meeting note, or evidence record.
  adr:
    purpose: Architecture decision record.
  runbook:
    purpose: Operational runbook or maintenance procedure.
  api:
    purpose: API, schema, integration, or interface reference.
  release:
    purpose: Release plan, changelog, or rollout record.
  incident:
    purpose: Incident, postmortem, risk, or reliability record.
  source-mirror:
    purpose: Machine-generated mirror of a binary/source file.
    machine_owned: true
    markdown_category: l1_projection
  source-ref:
    purpose: Human-readable companion for a non-mirrored source.
    markdown_category: authoritative_markdown_source
  repo-mirror:
    purpose: Machine-generated mirror of a configured repository.
    machine_owned: true
    markdown_category: l1_projection

statuses:
  draft:
    purpose: Draft material not yet reviewed.
    attention: true
  active:
    purpose: Current reviewed working knowledge.
  in-review:
    purpose: Awaiting human review.
    attention: true
  accepted:
    purpose: Accepted decision, interface, release, or runbook.
  deprecated:
    purpose: Replaced by newer engineering material.
    inactive: true
  archived:
    purpose: Retained but no longer active.
    inactive: true

required_properties:
  - title
  - type
  - status
  - domain
  - created
  - updated

optional_properties:
  - owner
  - tags
  - related
  - markdown_category
  - authority
  - component
  - repository
  - service
  - release

folder_plan:
  - path: 00_inbox
    domain: inbox
  - path: 10_product
    domain: product
  - path: 20_architecture
    domain: architecture
  - path: 30_decisions
    domain: decisions
  - path: 40_interfaces
    domain: interfaces
  - path: 50_runbooks
    domain: runbooks
  - path: 60_releases
    domain: releases
  - path: 70_incidents
    domain: incidents
  - path: 80_sources
    domain: sources
  - path: 80_sources/repos
    domain: sources

templates:
  - _templates/base-note.md
  - _templates/decision-record.md
  - _templates/source-ref.md

views: []
skills: []
benchmark_tasks: []

policy_defaults:
  mirror_mode: dedicated
  mirror_root: _mirrors
  native_source_mode: direct
  mirror_status: active
  repo_stub_status: draft
  repo_notes_dir: 80_sources/repos
  original_sources_authoritative: true
  real_data_in_repo: false
