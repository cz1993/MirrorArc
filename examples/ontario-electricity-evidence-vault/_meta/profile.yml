schema_version: 1
id: data-product
name: Data Product
profile_version: 0.2.0
description: Governed knowledge-projection workspace for source records, L1 projections, evidenced relationships, L2 views, context, governance, and operations.

markdown_categories:
  index:
    persistence: manual
  authoritative_markdown_source:
    persistence: authoritative
  l1_projection:
    persistence: rebuildable
  l2_generated_view:
    persistence: ephemeral
  l2_reviewed_view:
    persistence: governed
  operational_control:
    persistence: required

relationship_types:
  MIRRORS: {deterministic: true, review_required: false}
  DERIVED_FROM: {deterministic: true, review_required: false}
  IN_DOMAIN: {deterministic: true, review_required: false}
  HAS_LIFECYCLE: {deterministic: true, review_required: false}
  IN_PROFILE: {deterministic: true, review_required: false}
  DEPENDS_ON: {deterministic: true, review_required: false}
  REVIEW_DEPENDS_ON: {deterministic: true, review_required: false}
  IN_CONTEXT: {deterministic: true, review_required: false}
  MENTIONS: {deterministic: false, review_required: true}
  SAME_ENTITY: {deterministic: false, review_required: true}
  SUPPORTS: {deterministic: false, review_required: true}
  CONTRADICTS: {deterministic: false, review_required: true}
  SUPERSEDES: {deterministic: false, review_required: true}
  GOVERNS: {deterministic: false, review_required: true}
  INVALIDATES: {deterministic: true, review_required: false}

knowledge_lenses:
  orientation:
    purpose: Orient a new reader to governed evidence and current review work.
    audience: workspace reviewer
    source_query: {domains: [context, sources, governance, operations]}
    relationship_types: [MIRRORS, DERIVED_FROM, IN_DOMAIN, GOVERNS]
    output_sections: [scope, evidence, relationships, review-work]
    max_tokens: 1800
    persistence: ephemeral
    citation_required: true
  change-digest:
    purpose: Explain changed evidence and affected governed outputs.
    audience: workspace operator
    source_query: {freshness: changed}
    relationship_types: [MIRRORS, DEPENDS_ON, INVALIDATES]
    output_sections: [changes, impact, stale-views, next-actions]
    max_tokens: 1200
    persistence: ephemeral
    citation_required: true

review_policy:
  semantic_proposals_require_review: true
  preserve_reviewed_views: true
  automatic_promotion: false

context_defaults:
  max_tokens: 4000
  max_files: 20
  max_excerpt_chars: 6000
  allowed_modes: [metadata, dynamic, frozen]

domains:
  inbox:
    folder: 00_inbox
    purpose: Triage lane for new sources, questions, and agent drafts.
  context:
    folder: 10_context
    purpose: Product purpose, stakeholder questions, scope, glossary, and system context.
  sources:
    folder: 20_sources
    purpose: Original source files, source references, repository fixtures, and provenance records.
  contracts:
    folder: 30_data-contracts
    purpose: Schemas, semantic definitions, quality expectations, and interface contracts.
  pipelines:
    folder: 40_pipelines
    purpose: Ingestion, transformation, orchestration, lineage, and validation workflows.
  analysis:
    folder: 50_analysis
    purpose: Exploratory work, evidence synthesis, findings, and reproducible analytical narratives.
  models:
    folder: 60_models
    purpose: Model definitions, evaluations, gates, limitations, and monitoring context.
  outputs:
    folder: 70_outputs
    purpose: Reports, briefings, dashboards, published datasets, and stakeholder-ready artifacts.
  governance:
    folder: 80_governance
    purpose: Licensing, privacy, security, retention, approvals, risks, controls, and decisions.
  operations:
    folder: 90_operations
    purpose: Runbooks, incidents, release records, support, freshness, and reliability evidence.

note_types:
  hub:
    purpose: Legacy curated derivative retained only for migration classification.
    legacy_derivative: true
    markdown_category: legacy_curated_derivative
  note:
    purpose: Legacy curated derivative retained only for migration classification.
    legacy_derivative: true
    markdown_category: legacy_curated_derivative
  authoritative-record:
    purpose: Deliberately authored Markdown source whose author accepts authority.
    markdown_category: authoritative_markdown_source
  operational-control:
    purpose: Runtime, governance, profile, or operator control.
    markdown_category: operational_control
  knowledge-view:
    purpose: Governed L2 knowledge-view output.
    machine_owned: true
    markdown_category: l2_generated_view
  source-ref:
    purpose: Metadata and usage boundary for a referenced source.
    markdown_category: authoritative_markdown_source
  source-mirror:
    purpose: Machine-generated markdown mirror of a binary/source file.
    machine_owned: true
    markdown_category: l1_projection
  dataset:
    purpose: Dataset inventory, grain, coverage, ownership, and quality summary.
    markdown_category: authoritative_markdown_source
  data-contract:
    purpose: Schema, semantic, freshness, quality, or interface contract.
    markdown_category: authoritative_markdown_source
  pipeline:
    purpose: Pipeline purpose, lineage, schedule, controls, and recovery guidance.
    markdown_category: authoritative_markdown_source
  model:
    purpose: Model purpose, inputs, assumptions, outputs, and limitations.
    markdown_category: authoritative_markdown_source
  evaluation:
    purpose: Reproducible quality or model evaluation record.
    markdown_category: authoritative_markdown_source
  decision:
    purpose: Decision, options, evidence, rationale, and consequences.
    markdown_category: authoritative_markdown_source
  risk:
    purpose: Risk, trigger, likelihood, impact, controls, and owner.
    markdown_category: authoritative_markdown_source
  control:
    purpose: Governance or operational control with evidence and cadence.
    markdown_category: authoritative_markdown_source
  runbook:
    purpose: Operational procedure, verification, recovery, or support guide.
    markdown_category: authoritative_markdown_source
  report:
    purpose: Stakeholder-ready analytical or operational report.
    markdown_category: authoritative_markdown_source
  repo-mirror:
    purpose: Machine-generated mirror of a configured repository.
    machine_owned: true
    markdown_category: l1_projection

statuses:
  draft:
    purpose: Work in progress that has not been reviewed.
    attention: true
  active:
    purpose: Current reviewed working knowledge.
  in-review:
    purpose: Awaiting a named review or evidence check.
    attention: true
  accepted:
    purpose: Approved decision, contract, evaluation, or release artifact.
  monitored:
    purpose: Active item that is checked on a defined cadence.
  suppressed:
    purpose: Deliberately withheld from publication because a gate is not met.
    attention: true
  superseded:
    purpose: Replaced by newer material.
    inactive: true
  archived:
    purpose: Retained but no longer active.
    inactive: true

required_properties: [title, type, status, domain, created, updated]
optional_properties: [owner, tags, related, markdown_category, authority, source, source_url, source_format, license, dataset, pipeline, model, decision]

folder_plan:
  - path: 00_inbox
    domain: inbox
  - path: 10_context
    domain: context
  - path: 20_sources
    domain: sources
  - path: 20_sources/repos
    domain: sources
  - path: 30_data-contracts
    domain: contracts
  - path: 40_pipelines
    domain: pipelines
  - path: 50_analysis
    domain: analysis
  - path: 60_models
    domain: models
  - path: 70_outputs
    domain: outputs
  - path: 80_governance
    domain: governance
  - path: 90_operations
    domain: operations

templates:
  - _templates/base-note.md
  - _templates/data-contract.md
  - _templates/dataset.md
  - _templates/decision-record.md
  - _templates/evaluation.md
  - _templates/model.md
  - _templates/pipeline.md
  - _templates/runbook.md
  - _templates/source-ref.md

views: [Documents.base]
skills: []
benchmark_tasks: []

policy_defaults:
  mirror_mode: dedicated
  mirror_root: _mirrors
  native_source_mode: direct
  mirror_status: active
  repo_stub_status: draft
  repo_notes_dir: 20_sources/repos
  original_sources_authoritative: true
  real_data_in_repo: false
